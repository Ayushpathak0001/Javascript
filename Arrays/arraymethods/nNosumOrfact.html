<body>
    <script>
       let n=prompt("enter number")
       let arr=[]
       for(let i=1;i<=n;i++){
          arr[i-1]=i
       }
       let fact=arr.reduce((res,val)=>{
        return  res*val
       });
       console.log(fact)
    </script>
