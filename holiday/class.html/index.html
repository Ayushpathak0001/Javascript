<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<input type="Number" id="num" placeholder="enter your number">
<button onclick="factorial()">Factorial</button>
<p id="result"></p>
<script>
    function factorial(){
        let a=Number(document.getElementById("num").value);
        let fact=1;
        for(let i=1;i<=a;i++){
            fact*=i;
        }
        document.getElementById("result").innerHTML="fact ="+fact;
    }
</script>
    
</body>
</html>
