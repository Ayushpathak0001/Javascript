<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors game</title>
    <link rel="stylesheet" href="style.css" class="css">
</head>
<body>
    <h1>Rock paper Scissors</h1>
        <div class="choices">
            <div class="choice" id="rock">
    <img src="https://em-content.zobj.net/source/apple/391/raised-fist_270a.png" alt="Rock">
</div>

<div class="choice" id="paper">
    <img src="https://em-content.zobj.net/source/apple/391/raised-hand_270b.png" alt="Paper">
</div>

<div class="choice" id="scisscors">
    <img src="https://em-content.zobj.net/source/apple/391/victory-hand_270c-fe0f.png" alt="Scissors">
</div>

            
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>computer</p>
        </div>
    </div>
    <div class="msgcont">
    <div id="msg">Play Your Move</div>
    <div id="new">New Game</div>
    </div>
    <script src="java.js"></script>
    
</body>
</html>
